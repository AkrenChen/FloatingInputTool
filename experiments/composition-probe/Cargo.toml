[package]
name = "floating-composition-probe"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "=2.5.6"

[dependencies]
tauri = { version = "=2.10.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = [
  "Foundation", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop",
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_System_WinRT", "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D", "Win32_UI_WindowsAndMessaging"
] }
